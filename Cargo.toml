[workspace]
resolver = "2"
members = [
    "crates/pq-hash",
    "crates/pq-sign",
    "crates/shielded",
    "crates/prover",
    "crates/node",
    "crates/recursion-test",
]

# The vendored recursion tree is a full upstream repo with its OWN workspace root
# (vendor/p3-recursion/Cargo.toml). Without this `exclude`, cargo would treat the
# vendored crates as auto-members of THIS workspace, and their `version.workspace =
# true` / `[lints] workspace = true` inheritance would resolve against our
# manifest instead of upstream's. Excluding keeps them in their own workspace:
# upstream's package metadata and upstream's lint profile stay intact.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# Floor is set by Plonky3 v0.8.0's use of `MaybeUninit<[T]>` slice
# initialisation. The exact build toolchain is pinned in rust-toolchain.toml.
rust-version = "1.98.1"

# ---------------------------------------------------------------------------
# Dependency policy
#
# One version per crate across the whole workspace. `cargo deny` enforces it.
# Versions are aligned with what Plonky3 v0.8.0 and slh-dsa 0.2.0-rc.5 already
# pull in, so we do not create duplicate copies of sha2/sha3/rand.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- Post-quantum primitives (RustCrypto) ---
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.11", default-features = false }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
slh-dsa = { version = "0.2.0-rc.5", features = ["alloc"] }
signature = "3.0.0-rc.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }

# --- Plonky3 (STARK proving). Pinned to the v0.8.0 release line. ---
p3-air = "0.8.0"
p3-field = "0.8.0"
p3-matrix = "0.8.0"
p3-util = "0.8.0"
p3-koala-bear = "0.8.0"
p3-challenger = "0.8.0"
p3-commit = "0.8.0"
p3-fri = "0.8.0"
p3-merkle-tree = "0.8.0"
p3-symmetric = "0.8.0"
p3-uni-stark = "0.8.0"
p3-dft = "0.8.0"
p3-keccak = "0.8.0"

# Recursion: consumed from a VENDORED copy, NOT from git or crates.io.
#
# The crates.io `p3-recursion` 0.1.0 is an empty placeholder (zero dependencies).
# See .scratch/pq-shielded-rollup/issues/04-recursion-source-of-truth.md
#
# Upstream was pinned at rev
# 8f9876efb26cff0f4b837555b478f043c4314240 and then PATCHED locally. The patch
# is load-bearing: upstream hardcodes `const ZK: bool = false` on the WHIR uni
# PCS, which makes every blinding branch in uni-stark dead code and leaves spend
# secrets recoverable from opened trace cells. We cannot ship that.
# See .scratch/pq-shielded-rollup/decisions.md D-046.
#
# `vendor/p3-recursion` is a full copy of the upstream repo, including its own
# workspace root, so `workspace = true` inheritance inside it still resolves
# against upstream's manifest rather than ours. That also means the vendored
# crates keep upstream's lint profile instead of inheriting ours.
#
# The pristine copy at .scratch/vendor/p3-recursion-pristine is kept so the local
# diff can be re-emitted as a `git apply`-able patch against the upstream rev:
#
#   diff -ruN .scratch/vendor/p3-recursion-pristine vendor/p3-recursion
#
# Only the four crates we actually depend on are built from this tree.
p3-recursion = { path = "vendor/p3-recursion/recursion" }

# The recursion stack's own support crates. Same vendored tree as `p3-recursion`:
# these are built together upstream, and mixing a crates.io `p3-circuit` with a
# patched `p3-recursion` would give two incompatible `ExprId` types.
p3-circuit = { path = "vendor/p3-recursion/circuit" }
p3-circuit-prover = { path = "vendor/p3-recursion/circuit-prover" }
p3-poseidon2-circuit-air = { path = "vendor/p3-recursion/poseidon2-circuit-air" }
# `LiftPermToQuintic`: adapts the base-field Poseidon2 permutation to the D=5
# quintic challenge lanes the recursion circuit runs on. `publish = false`
# upstream, so it comes from the vendored tree, never crates.io.
p3-test-utils = { path = "vendor/p3-recursion/test-utils" }
# crates.io-side companions the recursion stack expects at the v0.8.0 line.
p3-lookup = "0.8.0"
p3-sumcheck = "0.8.0"
p3-whir = "0.8.0"
p3-multilinear-util = "0.8.0"
p3-poseidon2-air = "0.8.0"

# --- Infrastructure ---
thiserror = "2.0"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
subtle = { version = "2.6", default-features = false }

# --- Workspace crates ---
pq-hash = { path = "crates/pq-hash" }
pq-sign = { path = "crates/pq-sign" }
shielded = { path = "crates/shielded" }
prover = { path = "crates/prover" }

# ---------------------------------------------------------------------------
# Lints: deny-by-default. `cargo clippy -- -D warnings` is a hard gate.
# ---------------------------------------------------------------------------
# Lint policy.
#
# The highest-value gate is "no unwrap/expect/unsafe in shipped code". Crates
# enforce that per-crate with `cfg_attr(not(test), deny(..))` so tests may still
# unwrap freely. The workspace sets the baseline; `cargo clippy -- -D warnings`
# turns every warn below into a build failure.
#
# `arithmetic_side_effects` / `indexing_slicing` are left off at the workspace
# level: they fire on nearly every index computation in field/trace code and the
# signal drowns out. Security-critical arithmetic (balances, nullifier sets) uses
# explicit `checked_*` in the node crate instead, and that is where it matters.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_inline_in_public_items = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
