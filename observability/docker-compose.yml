# Observability stack for the PQ shielded rollup.
#
#   target/debug/node token --role readonly --ttl 86400 > observability/readonly.token
#   chmod 600 observability/readonly.token
#   docker compose -f observability/docker-compose.yml up -d
#
# Prometheus on :9090 (scrapes the node's token-guarded /metrics), Grafana
# on :3001 with the node dashboard pre-provisioned (admin/admin on first
# login - change it; this is a local dev stack, not a hosted one).
name: pq-rollup-observability
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./readonly.token:/etc/prometheus/readonly.token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
