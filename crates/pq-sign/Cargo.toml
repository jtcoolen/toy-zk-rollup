[package]
name = "pq-sign"
description = "Post-quantum spend authorization: SPHINCS+ (FIPS-205) behind a DI trait."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal crate: never published to crates.io, so path deps are fine.
publish = false

[features]
default = []
# Bring-up only. Accepts every signature. Never enable in release.
insecure-stub = []

[dependencies]
slh-dsa = { workspace = true }
# std_rng (the chacha-based StdRng) not thread_rng: the trait bound is
# CryptoRng and the tests seed a StdRng; thread_rng would pull getrandom,
# which does not build for wasm32-unknown-unknown without JS glue, into the
# wallet's wasm link.
rand = { workspace = true, features = ["std_rng", "std"] }

[lints]
workspace = true
