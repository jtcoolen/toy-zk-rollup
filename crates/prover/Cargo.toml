[package]
name = "prover"
description = "STARK proving and recursion over the shielded transfer AIR."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal crate: never published to crates.io, so path deps are fine.
publish = false

[dependencies]
pq-hash = { workspace = true }
pq-sign = { workspace = true }
shielded = { workspace = true }

p3-air = { workspace = true }
p3-field = { workspace = true }
p3-matrix = { workspace = true }
p3-util = { workspace = true }
p3-koala-bear = { workspace = true }
p3-challenger = { workspace = true }
p3-commit = { workspace = true }
p3-fri = { workspace = true }
p3-merkle-tree = { workspace = true }
p3-symmetric = { workspace = true }
p3-uni-stark = { workspace = true }
p3-dft = { workspace = true }
p3-keccak = { workspace = true }
# WHIR settlement path. `WhirUniPcs` is defined by the recursion crate (same rev
# as everywhere else in this workspace); `p3-whir` supplies the protocol
# parameters and `p3-sumcheck` the sumcheck layout WHIR folds through.
p3-recursion = { workspace = true }
p3-whir = { workspace = true }
p3-sumcheck = { workspace = true }

rand = { workspace = true, features = ["thread_rng", "std"] }

[lints]
workspace = true
