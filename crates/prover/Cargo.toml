[package]
name = "prover"
description = "STARK proving and recursion over the shielded transfer AIR."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal crate: never published to crates.io, so path deps are fine.
publish = false

[dependencies]
pq-hash = { workspace = true }
pq-sign = { workspace = true }
shielded = { workspace = true }

p3-air = { workspace = true }
p3-field = { workspace = true }
p3-matrix = { workspace = true }
p3-util = { workspace = true }
p3-koala-bear = { workspace = true }
p3-challenger = { workspace = true }
p3-commit = { workspace = true }
p3-fri = { workspace = true }
p3-merkle-tree = { workspace = true }
p3-symmetric = { workspace = true }
p3-uni-stark = { workspace = true }
p3-dft = { workspace = true }
p3-keccak = { workspace = true }
# WHIR settlement path. `WhirUniPcs` is defined by the recursion crate (same rev
# as everywhere else in this workspace); `p3-whir` supplies the protocol
# parameters and `p3-sumcheck` the sumcheck layout WHIR folds through.
p3-recursion = { workspace = true }
p3-whir = { workspace = true }
p3-sumcheck = { workspace = true }
# The recursion engine's own support crates. The in-circuit verifier circuit is a
# `p3_circuit::Circuit` proven through `p3_circuit_prover::BatchStarkProver`; its
# Poseidon2 non-primitive tables come from `p3_poseidon2_circuit_air`. Same git rev
# as `p3-recursion` so the `ExprId`/`Target` types are the same ones.
p3-circuit = { workspace = true }
p3-circuit-prover = { workspace = true }
p3-lookup = { workspace = true }
p3-poseidon2-circuit-air = { workspace = true }

rand = { workspace = true, features = ["thread_rng", "std"] }
serde = { workspace = true }

# Proof-size measurement only (dev). `postcard` is the compact binary format the
# settlement layer ships proofs in: it is `serde` over a varint-framed, non-self
# -describing encoding, so a `#[derive(Serialize)]` proof serializes without any
# JSON field-name overhead. The byte count is the calldata the chain pays for, so
# this is the number that decides whether on-chain verification is feasible.
[dev-dependencies]
serde_json = "1"
postcard = "1.1"

# Proving is embarrassingly parallel (DFT butterflies, LDE rows, Merkle nodes),
# but Plonky3 routes all of it through `p3-maybe-rayon`, a shim that maps
# `ParallelIterator` onto `core::iter::Iterator` unless the `parallel` feature
# is on. Without it every proof runs on one core. Enabled by default: a prover
# that leaves cores idle is the wrong default.
#
# Forwarded to every direct dependency that exposes the switch, rather than
# relying on feature unification to reach the shim indirectly.
[features]
default = ["parallel"]
parallel = [
    "p3-challenger/parallel",
    "p3-circuit-prover/parallel",
    "p3-circuit/parallel",
    "p3-dft/parallel",
    "p3-field/parallel",
    "p3-fri/parallel",
    "p3-lookup/parallel",
    "p3-matrix/parallel",
    "p3-merkle-tree/parallel",
    "p3-poseidon2-circuit-air/parallel",
    "p3-recursion/parallel",
    "p3-sumcheck/parallel",
    "p3-uni-stark/parallel",
    "p3-util/parallel",
    "p3-whir/parallel",
]

[lints]
workspace = true
