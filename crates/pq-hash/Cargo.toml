[package]
name = "pq-hash"
description = "Post-quantum hashing traits and impls: SHA3-256 shielded layer, Keccak-256 commitment layer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal crate: never published to crates.io, so path deps are fine.
publish = false

[dependencies]
sha3 = { workspace = true, features = ["alloc"] }
tiny-keccak = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
# The Poseidon2 commitment layer hashes field elements, so the Plonky3 field
# crates are part of this crate's crypto surface. They are pure Rust with no
# unsafe and no I/O; the "no Plonky3" claim in lib.rs predates D-088 and is
# updated there.
p3-field = { workspace = true }
p3-koala-bear = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-symmetric = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
