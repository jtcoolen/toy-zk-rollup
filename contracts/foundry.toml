[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# The verifier library sits within a few hundred bytes of the 24,576 B
# EIP-170 runtime limit. The solc metadata CBOR appended to the runtime
# (~53 B) is not code: dropping it buys real deployment margin with zero
# semantic effect (the deployed code hash changes; nothing pins it).
bytecode_hash = "none"

# The WHIR settlement proof replay is the heaviest computation in the
# system (the fib proof alone used 960M gas; the block proof is larger). The
# default test block gas limit (2^30-1) is below what a full verification
# needs, so tests run with the EVM maximum. This is a test-profile knob only;
# on a real chain the proof would not fit one block yet - that is the open
# gas-reduction work (D-068), deliberately deferred behind the E2E milestone.
gas_limit = 10000000000

# Generated vectors are read by tests via `vm.readFile`. Read-only, scoped to
# the vectors directory: the tests consume prover-emitted data and must not
# be able to read anything else.
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read-write", path = "./deployments" }]

# Strict: treat every compiler warning as an error so the build stays clean.
deny = "warnings"
via_ir = true

[lint]
# `require-revert-in-loop` is a gas heuristic, not a soundness rule. Every loop
# here is bounded by a constant (16 limbs, 4 fee limbs, 32 tree levels) or is a
# revert that IS the security property (nullifier replay, tree overflow). The
# heuristic cannot tell those apart, so it is off; the casts and bounds it would
# have caught are checked explicitly in LimbCodec.
exclude_lints = ["require-revert-in-loop"]

# Vendored third-party code is NOT linted by our policy.
#
# `lib/sol-whir-p3` is upstream MIT code (ethereum/sol-whir-p3, pinned commit
# recorded in the commit that added it). Rewriting it to satisfy our linter
# would break byte-identity against upstream, which is what makes the vendored
# copy auditable by diffing. The files carry their own SPDX headers and are
# reviewed as *imported* code, not as ours.
#
# Our own `src/` stays under the full strict policy.
ignore = ["lib/sol-whir-p3/"]

# Deliberately NO [fmt] section, and `forge fmt` is deliberately NOT in
# scripts/check.sh.
#
# Two reasons, both measured rather than stylistic.
#
# 1. The committed style is hand-formatted at roughly 100 columns. `forge fmt`
#    defaults to 120 and re-wraps signatures it considers short enough to fit on
#    one line. No `line_length` setting reproduces the committed style: `forge
#    fmt --check` reports 16-19 differing files at 96, 100, 104, 108, 112 and 120
#    alike. Running it produces a churn commit that touches files unrelated to
#    whatever was being worked on, which is exactly what happened once and had to
#    be reverted.
#
# 2. Upstream sol-whir-p3's own AGENTS.md records that the installed `forge fmt`
#    can move statements out of compact one-line `while` and `if` bodies,
#    "changing semantics or producing invalid syntax". A formatter that can
#    change semantics does not get to be a gate on code whose whole job is
#    reproducing a byte-exact protocol. `lib/sol-whir-p3` is vendored for
#    byte-identity with upstream, so it must not be reformatted at all.
#
# What IS enforced: `deny = "warnings"` above, plus `forge build` and `forge
# test` in the gate. Formatting is reviewed in review, not imposed by a tool
# that would rewrite the vendored tree.
