[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Strict: treat every compiler warning as an error so the build stays clean.
deny = "warnings"
via_ir = true

[lint]
# `require-revert-in-loop` is a gas heuristic, not a soundness rule. Every loop
# here is bounded by a constant (16 limbs, 4 fee limbs, 32 tree levels) or is a
# revert that IS the security property (nullifier replay, tree overflow). The
# heuristic cannot tell those apart, so it is off; the casts and bounds it would
# have caught are checked explicitly in LimbCodec.
exclude_lints = ["require-revert-in-loop"]
